; DroneMagNav firmware - ESP32-S3-WROOM-1-N16R8
; Build:  pio run
; Flash:  pio run -t upload        (USB-C, native USB-CDC; hold BOOT + tap RESET
;                                   the first time to enter the ROM downloader)
; Monitor: pio device monitor -b 115200
[env:dronemagnav]
; pioarduino build of the Espressif platform (current Arduino-ESP32 3.x core,
; packages served from GitHub releases; the PlatformIO registry mirror of the
; older 'espressif32' platform was unusably slow when this was verified)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi     ; N16R8: quad flash, octal PSRAM
board_build.flash_size = 16MB
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1
    -std=gnu++17
build_unflags = -std=gnu++11
lib_deps =
    ; only Arduino-ESP32 core libraries are used (WiFi, WebServer, SD_MMC, SPI)
